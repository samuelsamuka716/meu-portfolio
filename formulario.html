
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Meu Portfólio</title>

    <link rel="stylesheet" href="estilo.css">
    <script src="formulario.js" defer></script>
</head>
<body>

    <header class="cabecalho">
        <a href="index.html" class="marca">Meu Portfólio</a>

        <nav>
            <ul class="menu">
                <li><a href="index.html">Início</a></li>
                <li><a href="curriculo.html">Currículo</a></li>
                <li><a href="formulario.html" class="ativo">Contato</a></li>
                <li><a href="multimidia.html">Multimídia</a></li>
                <li><a href="graficos.html">Gráficos</a></li>
            </ul>
        </nav>
    </header>

    <main class="secao">
        <h1>Entre em contato</h1>
        <p>Preencha o formulário abaixo para enviar uma mensagem.</p>

        <section class="cartao">
            <form id="form-contato">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

                <button type="submit" class="botao">Enviar mensagem</button>

                <p id="feedback" class="feedback" role="status" aria-live="polite"></p>

            </form>
        </section>
    </main>

    <footer class="rodape">
        <p>© 2026 - Meu Portfólio Pessoal</p>
    </footer>

</body>
</html>
