<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Meu Portfólio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/scripts.js" defer></script>
</head>
<body>
  <header class="cabecalho">
    <a class="marca" href="index.html">Meu Portfólio</a>
    <nav aria-label="Menu principal"><ul class="menu">
      <li><a href="index.html">Início</a></li><li><a href="curriculo.html">Currículo</a></li>
      <li><a class="ativo" aria-current="page" href="formulario.html">Contato</a></li><li><a href="multimidia.html">Multimídia</a></li><li><a href="graficos.html">Gráficos</a></li>
    </ul></nav>
  </header>
  <main class="secao largura-form">
    <h1>Entre em contato</h1>
    <p class="introducao">Preencha os campos abaixo para enviar uma mensagem.</p>
    <form id="form-contato" novalidate>
      <label for="nome">Nome</label><input id="nome" name="nome" type="text" required minlength="2" placeholder="Seu nome">
      <label for="email">E-mail</label><input id="email" name="email" type="email" required placeholder="seuemail@exemplo.com">
      <label for="mensagem">Mensagem</label><textarea id="mensagem" name="mensagem" rows="5" required minlength="10" placeholder="Escreva sua mensagem"></textarea>
      <button class="botao" type="submit">Enviar mensagem</button>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    </form>
  </main>
  <footer class="rodape"><p>© 2026 — Meu Portfólio Pessoal</p></footer>
</body>
</html>
